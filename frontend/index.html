<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b27" />
    <meta name="description" content="Quantara portfolio analytics and risk intelligence dashboard." />
    <title>Quantara — Portfolio Analytics &amp; Risk Intelligence</title>
    <script>
      (() => {
        let preference = 'light';
        try {
          const saved = localStorage.getItem('quantara.appearance.v1');
          if (['light', 'dark', 'system'].includes(saved)) preference = saved;
        } catch {}
        const resolved = preference === 'system'
          ? (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', resolved === 'dark' ? '#111c27' : '#101b27');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
